name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # rust-toolchain.toml で `channel = "esp"` (= ESP32 embedded toolchain) を要求するが
      # CI runner には esp toolchain が無いため `cargo +stable fmt` で明示 override
      # (= [[feedback_alice_ci_phase_a_post_push_failures]] パターン 12 参照)
      - name: Check formatting
        run: cargo +stable fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

