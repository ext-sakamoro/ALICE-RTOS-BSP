name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALICE-RTOS-BSP
    steps:
      # cargo fmt は workspace 全体の manifest を解決するため path dep の sibling
      # (`alice-rtos = { path = "../ALICE-RTOS" }`) が runner 上に実在する必要がある
      # self を ALICE-RTOS-BSP/ に置いて sibling を並置する multi-repo layout
      # (build.yml と同形、ALICE-RTOS は public repo なので token 不要)
      - name: Checkout BSP
        uses: actions/checkout@v5
        with:
          path: ALICE-RTOS-BSP
      - name: Checkout ALICE-RTOS (path dep)
        uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-RTOS
          path: ALICE-RTOS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # rust-toolchain.toml で `channel = "esp"` (= ESP32 embedded toolchain) を要求するが
      # CI runner には esp toolchain が無いため `cargo +stable fmt` で明示 override
      # (= [[feedback_alice_ci_phase_a_post_push_failures]] パターン 12 参照)
      - name: Check formatting
        run: cargo +stable fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

