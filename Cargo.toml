[workspace]
resolver = "2"
members = [
    "crates/alice-bsp-atoms3",
    "crates/alice-bsp-stamps3",
    "crates/alice-bsp-atom-lite",
    "crates/alice-bsp-cores3",
    "crates/alice-bsp-stickc-plus2",
    "crates/alice-bsp-cardputer",
    "examples/blinky",
    "examples/ws2812_demo",
    "examples/imu_edge_demo",
    "examples/synth_demo",
    "examples/motion_demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-RTOS-BSP"
# dep floor: esp-hal 1.1.x 自身が rust-version = "1.88.0" を宣言している
# ("1.84" は根拠のない値だった) 実際に build に使う compiler は rust-toolchain.toml の
# channel = "esp" (xtensa 対応 fork、rustc 1.95.0-nightly 相当) で、stable では
# xtensa-esp32s3-none-elf を compile できないため本値は下限の目安
rust-version = "1.88"

[workspace.dependencies]
alice-rtos              = { path = "../ALICE-RTOS", features = ["esp32"] }
# esp-hal 1.2 で `clock::Clocks` が削除され (cpu_clock() / xtal_clock() の自由関数に置換)、
# esp-hal-smartled2 が 0.29.0 時点でも未追従で compile 不能になる
# caret ("1.1") は 1.2 を許してしまうため tilde で 1.1.x に閉じる
# 解除条件: esp-hal-smartled2 が esp-hal 1.2 対応版を publish
esp-hal                 = { version = "~1.1", features = ["esp32s3", "unstable"] }
esp-backtrace           = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-println             = { version = "0.17", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf  = { version = "0.5", features = ["esp32s3"] }
esp-hal-smartled2       = { version = "0.28" }
smart-leds              = { version = "0.4" }

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
debug         = false
strip         = true
panic         = "abort"

[profile.dev]
opt-level = "s"
debug     = true
